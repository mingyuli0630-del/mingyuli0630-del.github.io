<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>找不到頁面｜李明諭</title><style>

:root{
  --paper:#F9F7F2;
  --paper2:#FFFDF9;
  --ink:#303431;
  --muted:#74756F;
  --sage:#B87255;
  --sage2:#46524B;
  --line:#E3E0D8;
  --warm:#87917C;
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --sans:"Inter","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);line-height:1.75}
a{color:inherit;text-decoration:none}
button{font:inherit}
.wrap{max-width:var(--max);margin:auto;padding:0 24px}
header{position:sticky;top:0;z-index:50;background:rgba(249,247,242,.97);backdrop-filter:blur(14px);border-top:3px solid var(--sage);border-bottom:1px solid rgba(217,212,202,.9);box-shadow:0 7px 22px rgba(48,52,49,.035)}
.nav{min-height:78px;display:flex;align-items:center;justify-content:space-between;gap:28px}
.brand{display:flex;align-items:center;gap:12px;flex:0 0 auto}
.brandmark{width:42px;height:42px;border:1px solid var(--ink);border-radius:2px;display:grid;place-items:center;font-family:var(--serif);font-size:21px;transition:.2s ease}
.brand:hover .brandmark{background:var(--ink);color:var(--paper)}
.brand strong{display:block;font-size:14px;letter-spacing:.09em;line-height:1.35}
.brand small{display:block;font-family:var(--serif);font-size:10px;color:var(--muted);letter-spacing:.04em;margin-top:2px}
.nav-right{display:flex;align-items:center;gap:22px;margin-left:auto}
nav{display:flex;align-items:center;gap:5px;font-size:13px}
nav a{position:relative;padding:10px 13px;border:0;border-radius:2px;color:var(--muted);transition:.18s ease;white-space:nowrap}
nav a:hover{background:rgba(184,114,85,.07);color:var(--ink)}
nav a.active{background:rgba(184,114,85,.10);color:var(--ink);font-weight:700}
nav a.active:after{content:"";position:absolute;left:13px;right:13px;bottom:6px;height:1px;background:var(--sage)}
.nav-cta{display:inline-flex;align-items:center;justify-content:center;gap:9px;min-height:44px;padding:0 17px;background:var(--ink);color:var(--paper);border:1px solid var(--ink);font-size:12px;font-weight:700;letter-spacing:.04em;white-space:nowrap;transition:.18s ease}
.nav-cta:hover{background:var(--sage2);border-color:var(--sage2);transform:translateY(-1px)}
.nav-cta.active{background:var(--sage);border-color:var(--sage)}
.nav-cta .arrow{font-size:15px;line-height:1}
.menu-toggle{display:none;width:42px;height:42px;border:1px solid var(--line);background:transparent;color:var(--ink);font-size:18px;cursor:pointer}
section{padding:108px 0}
.border-top{border-top:1px solid var(--line)}
.eyebrow{font-size:11px;letter-spacing:.23em;color:var(--sage);font-weight:700;margin:0 0 10px}
.heading{max-width:790px;margin-bottom:44px}
.heading h2{font-family:var(--serif);font-size:clamp(38px,5vw,62px);font-weight:500;letter-spacing:-.035em;line-height:1.12;margin:0 0 14px}
.heading p{margin:0;color:var(--muted)}

.hero{min-height:calc(100svh - 68px);display:grid;grid-template-columns:1.05fr .95fr;gap:68px;align-items:center;padding-top:58px;padding-bottom:58px}
.hero h1{font-family:var(--serif);font-size:clamp(72px,10vw,120px);font-weight:500;line-height:.92;letter-spacing:-.065em;margin:5px 0 16px}
.hero-en{font-family:var(--serif);font-size:clamp(20px,2.2vw,28px);color:var(--sage);margin:0 0 27px}
.lead{font-size:clamp(19px,2vw,24px);max-width:650px;margin:0 0 30px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:28px}
.chip{border:1px solid var(--line);border-radius:999px;padding:7px 11px;font-size:12px;color:var(--muted);background:rgba(255,255,255,.22)}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:47px;border:1px solid var(--ink);border-radius:999px;padding:9px 17px;font-size:14px;font-weight:650;background:transparent;cursor:pointer}
.btn.primary{background:var(--ink);color:var(--paper)}
.btn:hover{background:var(--paper2)}
.btn.primary:hover{background:var(--sage2)}

.portrait{position:relative;background:var(--paper2);border:1px solid var(--line);padding:16px 16px 70px;box-shadow:0 18px 50px rgba(48,52,49,.065);min-height:590px}
.portrait:before{content:"";position:absolute;inset:12px -12px -12px 12px;border:1px solid #B77B5C2E;z-index:-1}
.portrait .photo{height:500px;background:
radial-gradient(circle at 50% 34%,#B77B5C2E 0 80px,transparent 81px),
linear-gradient(145deg,#EFEAE2,#FFFDFC);
display:grid;place-items:center;color:var(--sage);font-family:var(--serif);font-size:76px}
.portrait .photo img{width:100%;height:100%;object-fit:cover;object-position:center top;display:block}
.portrait .caption{position:absolute;left:34px;right:34px;bottom:19px;border-top:1px solid var(--line);padding-top:12px;display:flex;justify-content:space-between;gap:15px}
.caption span{font-size:10px;letter-spacing:.14em;color:var(--muted)}
.caption strong{font-family:var(--serif);font-size:12px;font-weight:500}

.about-grid{display:grid;grid-template-columns:190px minmax(0,1fr);gap:64px}
.sticky{position:sticky;top:100px;align-self:start}
.about-intro{font-family:var(--serif);font-size:clamp(28px,3.4vw,43px);line-height:1.55;margin:0 0 34px}
.about-copy{columns:2;column-gap:34px;color:#626761}
.about-copy p{break-inside:avoid;margin:0 0 20px}
.about-story{max-width:980px;width:100%}
.about-intro{padding:0 0 10px}
.about-kicker{font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--sage);margin:0 0 14px}
.about-grid>.heading{max-width:190px;margin-bottom:0}
.about-grid>.heading h2{font-size:clamp(38px,3.2vw,46px);letter-spacing:-.04em;margin-bottom:16px;white-space:nowrap}
.about-grid>.heading>p:not(.eyebrow):not(.about-side-note){font-size:14px;line-height:1.75}
.about-side-nav{margin-top:34px;border-top:1px solid var(--line)}
.about-side-nav a{display:grid;grid-template-columns:25px 1fr;gap:8px;padding:12px 0;border-bottom:1px solid var(--line);text-decoration:none;color:var(--muted);font-size:12px;line-height:1.4}
.about-side-nav a span{font-family:var(--serif);color:var(--sage)}
.about-side-nav a strong{font-weight:500;color:var(--ink)}
.about-side-note{font-family:var(--serif);font-size:15px;line-height:1.65;color:var(--sage2);margin-top:24px}

.about-lead{font-family:var(--serif);font-size:clamp(24px,2.5vw,34px);line-height:1.62;margin:0;max-width:800px;letter-spacing:-.015em}
.about-index{display:grid;grid-template-columns:repeat(3,1fr);gap:0;background:transparent;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:34px 0 58px}
.about-index a{display:block;background:transparent;padding:16px 18px 17px 0;text-decoration:none;color:var(--ink);transition:.2s ease;border-right:1px solid var(--line);margin-right:18px}
.about-index a:hover{opacity:.62}
.about-index span{display:inline-block;font-size:11px;letter-spacing:.16em;color:var(--sage);margin-right:10px}
.about-index strong{font-family:var(--serif);font-size:17px;font-weight:500}
.about-index a:last-child{border-right:0;margin-right:0}
.about-chapter{scroll-margin-top:90px;padding:0 0 58px;margin-bottom:58px;border-bottom:1px solid var(--line)}
.about-chapter:last-of-type{margin-bottom:32px}
.about-chapter-head{display:block;margin-bottom:30px;padding-left:0}
.about-no{font-family:var(--serif);font-size:12px;letter-spacing:.22em;color:var(--sage);margin-bottom:10px;padding-top:0;font-variant-numeric:tabular-nums}
.about-chapter h3{font-family:var(--serif);font-size:clamp(31px,3.4vw,44px);font-weight:500;line-height:1.18;margin:0;letter-spacing:-.025em}
.about-deck{font-family:var(--serif);font-size:19px;line-height:1.7;color:var(--sage2);margin:11px 0 0;max-width:none}
.about-body{max-width:820px;margin-left:0;color:#626761;font-size:16px;line-height:1.9}
.about-body p{margin:0 0 18px}
.about-body strong{color:var(--ink)}
.about-body h4{font-family:var(--serif);font-size:23px;font-weight:500;color:var(--ink);margin:38px 0 13px}
.about-quote{font-family:var(--serif);font-size:clamp(21px,2.1vw,28px);line-height:1.65;color:var(--ink);margin:30px 0;padding:4px 0 4px 20px;border-left:2px solid var(--sage)}
.about-subquote{font-family:var(--serif);font-size:20px;line-height:1.7;color:var(--sage2);margin:28px 0}
.about-principles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:30px 0 8px}
.about-principle{border-top:1px solid var(--line);background:transparent;padding:18px 8px 10px 0}
.about-principle small{display:block;color:var(--sage);letter-spacing:.1em;margin-bottom:10px}
.about-principle strong{font-family:var(--serif);font-size:19px;font-weight:500;line-height:1.45}
.about-detail{margin-top:26px;border-top:1px solid var(--line)}
.about-detail summary{cursor:pointer;list-style:none;padding:18px 0;font-size:14px;letter-spacing:.06em;color:var(--sage2);display:flex;justify-content:space-between;align-items:center}
.about-detail summary::-webkit-details-marker{display:none}
.about-detail summary::after{content:"＋";font-size:20px;font-weight:300}
.about-detail[open] summary::after{content:"－"}
.about-detail-content{padding:10px 0 4px}
.about-status{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:30px 0}
.about-status-card{border-top:1px solid var(--line);background:transparent;padding:18px 8px 10px 0}
.about-status-card small{display:block;color:var(--sage);letter-spacing:.1em;margin-bottom:9px}
.about-status-card strong{font-family:var(--serif);font-size:20px;font-weight:500;line-height:1.45}
.metrics{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--ink);border-bottom:1px solid var(--line);margin-top:38px}
.metric{padding:18px 18px 18px 0;border-right:1px solid var(--line)}
.metric:not(:first-child){padding-left:18px}
.metric:last-child{border-right:0}
.metric strong{display:block;font-family:var(--serif);font-size:23px;font-weight:500}
.metric small{color:var(--muted)}

.dark{background:var(--ink);color:var(--paper)}
.dark .eyebrow{color:#E5DED6}
.dark .heading p{color:#E5DED6}
.framework{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid rgba(255,255,255,.24)}
.framework article{min-height:260px;padding:26px 24px 18px 0;border-right:1px solid rgba(255,255,255,.17)}
.framework article:not(:first-child){padding-left:24px}
.framework article:last-child{border-right:0}
.framework span{font-family:var(--serif);color:#E5DED6}
.framework h3{font-family:var(--serif);font-size:27px;font-weight:500;margin:44px 0 10px}
.framework p{margin:0;color:#E5DED6}

.resume-grid{display:grid;grid-template-columns:1.3fr .7fr;gap:54px}
.timeline{border-top:1px solid var(--ink)}
.timeline article{display:grid;grid-template-columns:150px minmax(0,1fr);gap:30px;padding:28px 0;border-bottom:1px solid var(--line)}
.timeline .k{font-family:var(--serif);font-size:12px;line-height:1.55;letter-spacing:.04em;color:var(--sage);font-variant-numeric:tabular-nums}
.timeline h3{margin:0 0 5px;font-family:var(--serif);font-size:21px;font-weight:500}
.timeline .role{margin:0 0 9px;font-size:13px;letter-spacing:.05em;color:var(--sage2)}
.timeline p{margin:0;color:var(--muted);line-height:1.75}
.sidecard{background:var(--sage2);color:var(--paper);padding:30px;align-self:start}
.sidecard h3{font-family:var(--serif);font-size:30px;font-weight:500;margin:0 0 18px}
.sidecard ul{list-style:none;padding:0;margin:0}
.sidecard li{padding:9px 0;border-bottom:1px solid rgba(255,255,255,.16)}

.feature{display:grid;grid-template-columns:1fr 1fr;background:var(--paper2);border:1px solid var(--line);margin-bottom:16px}
.featurecopy{padding:38px}
.featurecopy h3{font-family:var(--serif);font-size:38px;line-height:1.2;font-weight:500;margin:9px 0 14px}
.featurecopy p{color:var(--muted)}
.tags{display:flex;gap:7px;flex-wrap:wrap;margin:20px 0}
.tag{border:1px solid var(--line);border-radius:999px;padding:5px 9px;font-size:11px;color:var(--muted)}
.preview{min-height:355px;background:
repeating-linear-gradient(0deg,transparent 0 29px,#B77B5C1F 30px 31px),
radial-gradient(circle at 66% 34%,transparent 0 64px,#B77B5C38 65px 67px,transparent 68px),
linear-gradient(135deg,#ece7dd,#FFFDFC);
display:flex;align-items:flex-end;padding:20px}
.preview span{font-family:var(--serif);font-size:13px;background:rgba(251,249,244,.9);padding:8px 10px;color:var(--sage)}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.card{background:var(--paper2);border:1px solid var(--line);padding:24px;min-height:240px}
.card small{color:var(--sage);letter-spacing:.1em}
.card h3{font-family:var(--serif);font-size:27px;line-height:1.3;font-weight:500;margin:16px 0 10px}
.card p{color:var(--muted);margin:0}

.gallery{display:grid;grid-template-columns:1.3fr .7fr .7fr;grid-auto-rows:230px;gap:12px}
.g{position:relative;border:1px solid var(--line);overflow:hidden;background:linear-gradient(145deg,#e7e3da,#FFFDFC)}
.g.big{grid-row:span 2}
.g img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;transition:transform .45s ease}
.g:hover img{transform:scale(1.025)}
.g.focus-top img{object-position:center 28%}
.g.focus-right img{object-position:66% center}
.g .p{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--serif);font-size:56px;color:#B77B5C5C}
.g:after{content:"";position:absolute;inset:45% 0 0;background:linear-gradient(transparent,rgba(39,48,43,.60))}
.g label{position:absolute;z-index:2;left:16px;right:16px;bottom:14px;padding-top:9px;border-top:1px solid rgba(255,255,255,.62);display:flex;justify-content:space-between;color:#fff;font-size:11px}
/* Teaching Moments: six photos use one consistent visual scale */
.teaching-gallery{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  grid-auto-rows:auto;
  gap:16px;
}
.teaching-gallery .g{
  margin:0;
  aspect-ratio:4 / 3;
  min-width:0;
}
.teaching-gallery .g.big{
  grid-row:auto;
  grid-column:auto;
}
.teaching-gallery .g label{
  left:14px;
  right:14px;
  bottom:12px;
  gap:12px;
  align-items:flex-end;
}
.teaching-gallery .g label span{
  font-size:12px;
  line-height:1.45;
}
.teaching-gallery .g label strong{
  flex:0 0 auto;
  font-size:10px;
  font-weight:500;
  letter-spacing:.08em;
}


.growth{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.grow{border-top:2px solid var(--sage);padding-top:20px}
.grow h3{font-family:var(--serif);font-size:27px;line-height:1.35;font-weight:500;margin:8px 0}
.grow p{color:var(--muted)}

.notes{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--ink)}
.note{padding:26px 28px 26px 0;border-bottom:1px solid var(--line)}
.note:nth-child(odd){border-right:1px solid var(--line)}
.note:nth-child(even){padding-left:28px}
.note small{color:var(--sage);letter-spacing:.1em}
.note h3{font-family:var(--serif);font-size:27px;font-weight:500;line-height:1.35;margin:9px 0}
.note p{color:var(--muted);margin:0}

.cvpromo{display:grid;grid-template-columns:1fr auto;gap:28px;align-items:center;padding:36px;border:1px solid var(--line);background:var(--paper2)}
.cvpromo h3{font-family:var(--serif);font-size:34px;font-weight:500;margin:0 0 8px}
.cvpromo p{margin:0;color:var(--muted);max-width:700px}

.contact{background:var(--sage2);color:var(--paper);padding:66px;text-align:center}
.contact h2{font-family:var(--serif);font-size:clamp(40px,5vw,62px);font-weight:500;line-height:1.2;margin:7px auto 14px}
.contact p{color:#E5DED6}
footer{border-top:1px solid var(--line);padding:28px 0 42px;color:var(--muted);font-size:11px}
footer .wrap{display:flex;justify-content:space-between}


/* Courses & Tuition */
.enrollment-notice{
  display:flex;
  gap:18px;
  align-items:baseline;
  margin:-8px 0 34px;
  padding:15px 0;
  border-top:1px solid var(--sage);
  border-bottom:1px solid var(--line);
}
.enrollment-notice small{
  flex:0 0 auto;
  font-size:10px;
  letter-spacing:.16em;
  color:var(--sage);
}
.enrollment-notice strong{
  font-family:var(--serif);
  font-size:17px;
  font-weight:500;
  color:var(--ink);
}
.course-shell{display:grid;grid-template-columns:.9fr 1.1fr;gap:42px;align-items:start}
.course-intro{position:sticky;top:96px}
.course-intro .price-lead{font-family:var(--serif);font-size:34px;line-height:1.35;margin:7px 0 16px}
.course-intro p{color:var(--muted)}
.course-badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px}
.course-badge{border:1px solid var(--line);border-radius:99px;padding:7px 10px;background:var(--paper2);font-size:11px;color:var(--muted)}
.pricebox{background:var(--paper2);border:1px solid var(--line);padding:26px}
.pricebox h3{font-family:var(--serif);font-size:28px;font-weight:500;margin:0 0 16px}
.price-table-wrap{overflow-x:auto}
.price-table{width:100%;border-collapse:collapse;min-width:610px}
.price-table th,.price-table td{padding:12px 10px;border-bottom:1px solid var(--line);text-align:left;font-size:12px;vertical-align:top}
.price-table th{font-size:10px;letter-spacing:.1em;color:var(--muted);font-weight:700}
.price-table td strong{font-family:var(--serif);font-size:17px;font-weight:500}
.price-note{margin-top:14px;padding-top:14px;border-top:1px solid var(--line);font-size:11px;color:var(--muted)}
.course-types{margin-top:18px;display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.course-group{background:var(--paper2);border:1px solid var(--line);padding:22px}
.course-group>small{color:var(--sage);letter-spacing:.12em}
.course-group h3{font-family:var(--serif);font-size:26px;font-weight:500;margin:7px 0 15px}
.course-group details{border-top:1px solid var(--line)}
.course-group summary{cursor:pointer;padding:12px 0;font-size:13px;font-weight:650;list-style:none}
.course-group summary::-webkit-details-marker{display:none}
.course-group summary:after{content:"＋";float:right;color:var(--sage)}
.course-group details[open] summary:after{content:"－"}
.course-group details p{font-size:12px;color:var(--muted);margin:0 0 12px}
.course-info{display:grid;grid-template-columns:repeat(4,1fr);margin-top:17px;border-top:1px solid var(--ink);border-bottom:1px solid var(--line)}
.course-info div{padding:16px;border-right:1px solid var(--line)}
.course-info div:first-child{padding-left:0}.course-info div:last-child{border-right:0}
.course-info strong{display:block;font-family:var(--serif);font-size:18px;font-weight:500}
.course-info small{color:var(--muted)}

/* Resume builder */
.resume-layer{position:fixed;inset:0;background:rgba(39,48,43,.64);backdrop-filter:blur(5px);z-index:100;display:none;overflow:auto;padding:24px}
.resume-layer.open{display:block}
.builder{max-width:1180px;margin:auto;display:grid;grid-template-columns:310px 1fr;gap:16px}
.controls{background:var(--paper);padding:24px;position:sticky;top:0;align-self:start;max-height:calc(100vh - 48px);overflow:auto}
.controls h3{font-family:var(--serif);font-size:28px;font-weight:500;margin:0 0 8px}
.controls p{font-size:12px;color:var(--muted)}
.controlrow{padding:12px 0;border-top:1px solid var(--line)}
.controlrow label{display:flex;align-items:center;gap:9px;font-size:13px;cursor:pointer}
.ctrl-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.resume-paper{background:#fff;color:#1c211e;min-height:1123px;padding:58px 66px;box-shadow:0 20px 70px rgba(0,0,0,.22)}
.r-head{display:grid;grid-template-columns:1fr auto;gap:20px;border-bottom:1.5px solid #222;padding-bottom:20px;margin-bottom:24px}
.r-head h1{font-family:var(--serif);font-size:38px;font-weight:500;margin:0}
.r-head .sub{font-size:14px;color:#555;margin-top:4px}
.r-contact{text-align:right;font-size:11px;color:#555}
.r-section{margin:23px 0}
.r-section.hidden{display:none}
.r-section h2{font-size:11px;letter-spacing:.18em;text-transform:uppercase;border-bottom:1px solid #bbb;padding-bottom:5px;margin:0 0 12px}
.r-item{display:grid;grid-template-columns:125px 1fr;gap:16px;margin:11px 0}
.r-date{font-size:11px;color:#666}
.r-item h3{font-size:14px;margin:0 0 3px}
